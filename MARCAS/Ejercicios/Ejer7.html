<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>

<style>

    .contenedor {
        display: grid;
        grid-template-columns:200px 1fr;
        grid-template-rows:100px 1fr 80px;
        gap:10px;
        min-height:100vh;
    }

    .logo img{
        width:100%;
        height:70%;
        align-content: center;
    }

    header{
        background-color: #90ee90;
        grid-column: 2/3;
        grid-row: 1/3;
        text-align: center;
    }

    nav{
        background-color: #add8e6;
        grid-column: 1/2;
        grid-row:2/3;
    }

    main{
        background-color: #f5f5dc;
        grid-column: 2/2;
        grid-row:2/3;
        padding: 10px;
    }

    footer{
        background-color: #d3d3d3;
        grid-column: 1/3;
        text-align: center;
        align-content: center;
    }


</style>

<body>

<div class="contenedor">
    <div class="logo"><img src="Logo.jpg" height="85" width="297"/></div>
    <header><h1>Veterinaria Patitas Felices</h1></header>
    <nav>
        <ul>
            <li>Inicio</li>
            <li>Servicios</li>
            <li>Equipo</li>
            <li>Contacto</li>
        </ul>
    </nav>
    <main>
        <h2>Bienvenidos</h2>
        <p>Cuidamos la salud y el bienestar de tus mascotas.</p>
    </main>
    <footer><p>© 2026 Veterinaria Patitas Felices</p></footer>
</div>


</body>
</html>
